import com.vanniktech.maven.publish.SonatypeHost
import com.vanniktech.maven.publish.AndroidSingleVariantLibrary

plugins {
    alias(libs.plugins.android.library)
    alias(libs.plugins.jetbrains.kotlin.android)
    id "com.vanniktech.maven.publish" version "0.29.0"
}

android {
    namespace 'io.pixelbin.glamar'
    compileSdk 34

    defaultConfig {
        minSdk 26

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {

    implementation libs.androidx.core.ktx
    implementation libs.androidx.appcompat
    implementation libs.material
    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
    implementation libs.okhttp
    implementation(libs.gson)
}

mavenPublishing {
    coordinates("io.pixelbin.glamar", "glamar", "1.0.1")

    pom {
        name = "GlamAR"
        description = "The GlamAR SDK provides tools to integrate augmented reality (AR) features into your Android application"
        inceptionYear = "2024"
        url = "https://glamar.io"
        licenses {
            license {
                name = "The Apache License, Version 2.0"
                url = "http://www.apache.org/licenses/LICENSE-2.0.txt"
                distribution = "http://www.apache.org/licenses/LICENSE-2.0.txt"
            }
        }
        developers {
            developer {
                id = "pixelbin.io"
                name = "PixelBin.io"
                url = "https://github.com/pixelbin-io"
            }
        }
        scm {
            url = "https://github.com/pixelbin-io/glamar-android"
            connection = "scm:git:git://github.com/pixelbin-io/glamar-android.git"
            developerConnection = "scm:git:ssh://git@github.com/pixelbin-io/glamar-android.git"
        }
    }
    configure(new AndroidSingleVariantLibrary("release", true, true))
    publishToMavenCentral(SonatypeHost.CENTRAL_PORTAL)
    signAllPublications()
}
